name: Relay Content Update to Cloudflare Pages

on:
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Touch Cloudflare Pages trigger file
        run: |
          echo "triggered at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .cloudflare-pages-trigger
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .cloudflare-pages-trigger
          if git diff --cached --quiet; then
            echo "No change; skip commit"
            exit 0
          fi
          git commit -m "chore: trigger Cloudflare Pages"
          git push origin main
